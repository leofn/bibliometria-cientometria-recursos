name: Validar repositório

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar estrutura e dados
        run: python scripts/validate_repo.py
      - name: Executar exemplo offline
        run: python exemplos/resumo_corpus.py data/referencias.csv
